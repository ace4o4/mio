[package]
name = "mio-island"
version = "0.1.0"
description = "MIO desktop companion island"
authors = ["MIO"]
edition = "2021"

[lib]
name = "mio_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = [] }

[profile.dev]
incremental = false
codegen-units = 1

[profile.dev.build-override]
incremental = false
codegen-units = 1

[profile.release]
codegen-units = 1


